[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipshot"
version = "0.1.0"
description = "WeChat/QQ-style screenshot tool for Linux (Wayland/X11)"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.4",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-qt>=4.2"]

[project.scripts]
snipshot = "snipshot.cli:main"

[tool.setuptools.packages.find]
include = ["snipshot*"]
